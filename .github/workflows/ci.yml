name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  source-check:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-build.txt
      - name: Check Python and JSON
        shell: pwsh
        run: |
          python -m compileall -q webui/backend webui/tools examples
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem webui,shared -Recurse -File -Filter *.json | ForEach-Object {
            Get-Content -Raw -LiteralPath $_.FullName | ConvertFrom-Json | Out-Null
          }
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem webui/frontend/src -Recurse -File -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: python webui/tools/check_fonts.py
      - run: python webui/tools/check_asset_references.py
      - run: node examples/check_export_groups.cjs
